<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tech Report · 每周 AI 行业动态</title>
<meta name="description" content="每周 AI 科技行业动态追踪报告">
<meta property="og:type" content="website">
<meta property="og:title" content="AI Tech Report · 每周 AI 行业动态">
<meta property="og:description" content="每周 AI 科技行业动态追踪报告">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="AI Tech Report · 每周 AI 行业动态">
<meta name="twitter:description" content="每周 AI 科技行业动态追踪报告">
<script>
(function () {
  var key = 'ai-tech-report-theme';
  var saved;
  try { saved = localStorage.getItem(key); } catch (e) {}
  var preference = saved === 'light' || saved === 'dark' ? saved : 'auto';
  var systemDark = window.matchMedia('(prefers-color-scheme: dark)');
  var toggle;
  function applyTheme() {
    document.documentElement.dataset.theme = preference === 'auto'
      ? (systemDark.matches ? 'dark' : 'light') : preference;
    if (toggle) {
      var label = document.documentElement.dataset.theme === 'dark' ? '切换到浅色模式' : '切换到深色模式';
      toggle.setAttribute('aria-label', label);
      toggle.title = label;
    }
  }
  applyTheme();
  systemDark.addEventListener('change', function () {
    if (preference === 'auto') applyTheme();
  });
  document.addEventListener('DOMContentLoaded', function () {
    toggle = document.getElementById('themeToggle');
    applyTheme();
    toggle.addEventListener('click', function () {
      preference = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem(key, preference); } catch (e) {}
      applyTheme();
    });
  });
})();
</script>
<style>
  :root {
    color-scheme: light;
    --accent: #2563eb; --accent-soft: rgba(37, 99, 235, .10);
    --text: #1f2937; --muted: #6b7280;
    --bg: #ffffff; --border: #e5e7eb; --soft: #f3f4f6;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --accent: #60a5fa; --accent-soft: rgba(96, 165, 250, .14);
    --text: #d1d5db; --muted: #9ca3af;
    --bg: #111827; --border: #40506a; --soft: #222d3d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      color-scheme: dark;
      --accent: #60a5fa; --accent-soft: rgba(96, 165, 250, .14);
      --text: #d1d5db; --muted: #9ca3af;
      --bg: #111827; --border: #40506a; --soft: #222d3d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--text); background: var(--bg);
    font-size: 16px; line-height: 1.8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .container { max-width: 956px; margin: 0 auto; padding: 56px 28px 80px; }
  .site-head { padding-right: 52px; }
  .theme-toggle { position: absolute; top: 28px; right: 28px; z-index: 60; display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 1px solid var(--border); border-radius: 50%; background: var(--soft); color: var(--text); cursor: pointer; }
  .theme-toggle:hover { color: var(--accent); border-color: var(--accent); }
  .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .theme-toggle svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .theme-toggle .icon-sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) .theme-toggle .icon-sun { display: block; }
    :root:not([data-theme]) .theme-toggle .icon-moon { display: none; }
  }
  .site-title { font-size: 34px; margin: 0 0 8px; letter-spacing: .3px; }
  .site-desc { color: var(--muted); font-size: 17px; margin: 0 0 8px; }
  .site-meta { color: var(--muted); font-size: 13.5px; margin: 0 0 40px; }
  .year-nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 36px; }
  .year-nav a {
    padding: 4px 14px; border: 1px solid var(--border); border-radius: 999px;
    font-size: 14px;
  }
  .year-nav a:hover { background: var(--accent-soft); text-decoration: none; }
  .year-group { margin: 0 0 38px; }
  .year-heading { margin: 0 0 20px; font-size: 19px; }
  .timeline { margin-left: 8px; border-left: 2px solid var(--border); }
  .report-item { position: relative; padding: 0 4px 28px 28px; margin-bottom: 28px; }
  .report-item::before {
    content: ""; position: absolute; top: 8px; left: -7px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg);
  }
  .report-item:last-child { margin-bottom: 0; }
  .report-item .date { color: var(--muted); font-size: 13px; }
  .report-item h2 { font-size: 21px; line-height: 1.5; margin: 8px 0; }
  .report-item h2 a { color: var(--text); transition: color .15s; }
  .report-item:hover h2 a { color: var(--accent); }
  .report-lead {
    display: -webkit-box; margin: 10px 0 0; overflow: hidden;
    color: var(--muted); font-size: 15px; line-height: 1.75;
    -webkit-box-orient: vertical; -webkit-line-clamp: 3;
    line-clamp: 3;
  }
  .empty { color: var(--muted); }
  @media (max-width: 640px) {
    .report-lead { -webkit-line-clamp: 4; line-clamp: 4; }
  }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题">
  <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13.1A9 9 0 0 1 10.9 3.1 9 9 0 1 0 20.9 13.1Z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
</button>
<div class="container">
  <header class="site-head">
    <h1 class="site-title">AI Tech Report</h1>
    <p class="site-desc">每周 AI 科技行业动态追踪报告</p>
    <p class="site-meta">共 $report_count 期</p>
  </header>
  <main>
$year_nav
$report_list
  </main>
</div>
</body>
</html>
